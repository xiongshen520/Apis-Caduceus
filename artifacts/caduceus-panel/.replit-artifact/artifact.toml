kind = "web"
previewPath = "/panel/"
title = "Apis Caduceus Panel"
version = "1.0.0"
id = "artifacts/caduceus-panel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/panel/" ]
localPort = 24402

[services.development]
run = "pnpm --filter @workspace/caduceus-panel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/caduceus-panel", "run", "build" ]
publicDir = "artifacts/caduceus-panel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24402"
BASE_PATH = "/panel/"
